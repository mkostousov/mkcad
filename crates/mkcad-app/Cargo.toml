[package]
name = "mkcad-app"
version.workspace = true
edition.workspace = true
description = "mkcad application"
publish.workspace = true

[[bin]]
name = "mkcad"
path = "src/main.rs"

[dependencies]
mkcad-domain = { path = "../mkcad-domain" }
mkcad-solver = { path = "../mkcad-solver" }
eframe = { version = "0.27", features = ["wgpu"] }
mkcad-render = { path = "../mkcad-render" }
glam = "0.27"
egui = "0.27"
serde_json = "1.0.154"

[dev-dependencies]
