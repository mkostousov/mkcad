[package]
name = "mkcad-solver"
version.workspace = true
edition.workspace = true
description = "Deterministic, explainable 2D geometric constraint solver"
publish.workspace = true

[dependencies]
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
nalgebra = "0.35.0"
serde_json = "1.0.154"

[[bench]]
name = "solve"
harness = false
