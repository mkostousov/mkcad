[package]
name = "sketch-solver"
version = "0.1.0"
edition = "2024"
description = "PoC K-1: deterministic, explainable 2D geometric constraint solver"
publish = false

[dependencies]
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
nalgebra = "0.35.0"
serde_json = "1.0.154"
